<div class="row">
  <div class="col-xs-12 col-sm-8 col-md-6 col-sm-offset-2 col-md-offset-3">
    <form (ngSubmit)="onLoginSubmit()">
      <h2>Log in</h2>
      <hr />
      <div class="form-group">
        <input
          type="email"
          name="email"
          id="email"
          class="form-control input-lg"
          placeholder="Email Address"
          [(ngModel)]="credentials.email"
        />
      </div>
      <div class="form-group">
        <input
          type="password"
          name="password"
          id="password"
          class="form-control input-lg"
          placeholder="Password"
          [(ngModel)]="credentials.password"
        />
      </div>
      <div *ngIf="formError" class="alert alert-danger" role="alert">
        {{ formError }}
      </div>
      <div class="row">
        <div class="col-xs-6 col-sm-6 col-md-6">
          <input
            type="submit"
            class="btn btn-lg btn-primary btn-block"
            value="Log in"
          />
        </div>
      </div>
      <div class="row">
        <div class="col-xs-12 text-center">
          <a routerLink="/register" href="/register" style="color: red; background-color: yellow; padding: 10px; border: 1px solid black; display: inline-block;">Register</a>
        </div>
      </div>
    </form>
  </div>
</div>
