<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dive Sites - Bhaccasyoniztas Beach Resort Website Template</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
</head>
<body>
    <div id="background">
        <div id="page">
            <div id="header">
                <div id="logo">
                    <a href="index.html"><img src="images/logo.png" alt="LOGO" height="100" width="200"></a>
                </div>
                <div id="navigation">
                    <ul>
                        <li>
                            <a href="index.html">Home</a>
                        </li>
                        <li class="selected">
                            <a href="travel.html">Travel</a>
                        </li>
                        <li>
                            <a href="rooms.html">Rooms</a>
                        </li>
                        <li>
                            <a href="meals.html">Meals</a>
                        </li>
                        <li>
                            <a href="news.html">News</a>
                        </li>
                        <li>
                            <a href="about.html">About</a>
                        </li>
                        <li>
                            <a href="contact.html">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div id="contents">
                <div class="box">
                    <div>
                        <div class="body">
                            <h1>Travel</h1>
                            <ul id="sites">
                                </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="footer">
            <div>
                <ul class="navigation">
                    <li>
                        <a href="index.html">Home</a>
                    </li>
                    <li class="active">
                        <a href=“travel.html">Travel</a>
                    </li>
                    <li>
                        <a href="rooms.html">Rooms</a>
                    </li>
                    <li>
                        <a href=“meals.html">Meals</a>
                    </li>
                    <li>
                        <a href="news.html">News</a>
                    </li>
                    <li>
                        <a href="about.html">About</a>
                    </li>
                    <li>
                        <a href="contact.html">Contact</a>
                    </li>
                </ul>
                <div id="connect">
                    <a href="http://pinterest.com/fwtemplates/" target="_blank" class="pinterest"></a> <a href="http://freewebsitetemplates.com/go/facebook/" target="_blank" class="facebook"></a> <a href="http://freewebsitetemplates.com/go/twitter/" target="_blank" class="twitter"></a> <a href="http://freewebsitetemplates.com/go/googleplus/" target="_blank" class="googleplus"></a>
                </div>
            </div>
            <p>
                © 2023 by BHACCASYONIZTAS BEACH RESORT. All Rights Reserved
            </p>
        </div>
    </div>

    <script>
        const websocket = new WebSocket('ws://localhost:8080');
        const sitesList = document.getElementById('sites');

        websocket.onopen = () => {
            console.log('WebSocket connection established on user site.');
            fetch('/api/trips')
                .then(response => response.json())
                .then(trips => {
                    renderTrips(trips);
                })
                .catch(error => console.error('Error fetching initial trips:', error));
        };

        websocket.onmessage = (event) => {
            try {
                const message = JSON.parse(event.data);
                console.log('Received WebSocket message on user site:', message);

                switch (message.type) {
                    case 'tripAdded':
                        fetchAndRenderTrips(); 
                        break;
                    case 'tripUpdated':
                        fetchAndRenderTrips(); 
                        break;
                    case 'tripDeleted':
                        fetchAndRenderTrips(); 
                        break;
                }
            } catch (error) {
                console.error('Error processing WebSocket message:', error);
            }
        };

        websocket.onclose = () => {
            console.log('WebSocket connection closed on user site.');
            setTimeout(() => {
                websocket = new WebSocket('ws://localhost:8080');
            }, 3000);
        };

        websocket.onerror = (error) => {
            console.error('WebSocket error on user site:', error);
        };

        function renderTrips(trips) {
            sitesList.innerHTML = ''; // Clear existing list
    		trips.forEach(trip => {
        		const listItem = document.createElement('li');
        		listItem.innerHTML = `
					<a href=“travel.html"><img src="images/${trip.image || 'default.jpg'}" alt="${trip.name}"></a>
					<h2><a href=“travel.html">${trip.name}</a></h2>
					<p>${trip.description}</p>
       			 `;
        sitesList.appendChild(listItem);
            });
        }

        function fetchAndRenderTrips() {
            fetch('/api/trips') 
                .then(response => response.json())
                .then(trips => {
                    renderTrips(trips);
                })
                .catch(error => console.error('Error fetching trips:', error));
        }
    </script>
</body>
</html>
